# LOCAL DEVELOPMENT ONLY
# For test/prod deployment, use: fly deploy --config fly.test.toml or fly.prod.toml
services:
  # Development Services
  mongodb:
    image: mongo:8.0.15
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=dev
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - mongodb_data:/data/db

  localstack:
    image: localstack/localstack:3.8.1
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      # - DEBUG=1
      - SERVICES=s3
      - TRIES=30
      - BUCKET_NAMES=${STORAGE_BUCKET:-training-gym}
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
      - ./localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend-dev:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    container_name: backend
    working_dir: /app
    command: npm run dev
    tty: true
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
      # training data output
      - ./public/screenshots:/app/backend/public/screenshots
    environment:
      # CORS Configuration
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

      # Database
      - DB_URI=${DB_URI:-mongodb://admin:admin@mongodb:27017/dev?authSource=admin}

      # Blockchain
      - RPC_URL=${RPC_URL:-https://sepolia.base.org}
      - GRAPH_ENDPOINT=${GRAPH_ENDPOINT}

      # Object Storage (LocalStack for local dev)
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-test}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-test}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-http://localstack:4566}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-training-gym}

      # External APIs
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Internal services
      - CQA_PATH=/app/clones-quality-agent
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SESSION_SECRET=${SESSION_SECRET}

      # Contracts info
      - REWARD_POOL_FACTORY_ADDRESS=${REWARD_POOL_FACTORY_ADDRESS}
      - CLAIM_ROUTER_ADDRESS=${CLAIM_ROUTER_ADDRESS}
      - PUBLISHER_ADDRESS=${PUBLISHER_ADDRESS}
      - PUBLISHER_PRIVATE_KEY=${PUBLISHER_PRIVATE_KEY}

      # Quality Agent
      - CQA_MODEL=${CQA_MODEL}
      - CQA_EVALUATION_MODEL=${CQA_EVALUATION_MODEL}

      # Price USD API
      - PRICE_USD_API_URL=${PRICE_USD_API_URL:-http://host.docker.internal:8080}
      - PRICE_USD_API_KEY=${PRICE_USD_API_KEY}

      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
    depends_on:
      - mongodb
      - localstack
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "deb.debian.org:host-gateway"

networks:
  default:
    external: true
    name: clones-network

volumes:
  mongodb_data:
  redis_data:
